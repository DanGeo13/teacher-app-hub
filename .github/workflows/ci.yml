name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: 'Apps/system/hermes-hub/frontend/package-lock.json' }
      - run: bash scripts/bootstrap-dev.sh
      - run: Apps/system/hermes-hub/backend/.venv/bin/pytest
      - run: npm --prefix Apps/system/hermes-hub/frontend test
      - run: npm --prefix Apps/system/hermes-hub/frontend run typecheck
      - run: npm --prefix Apps/system/hermes-hub/frontend run build
      - name: Install pinned Chromium and Linux dependencies
        working-directory: Apps/system/hermes-hub/frontend
        # The Playwright CDN intermittently resets connections (ECONNRESET).
        # Retry a bounded number of times so a transient network failure does
        # not fail the browser gate for reasons unrelated to the application.
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Chromium download attempt ${attempt} failed; retrying after backoff."
            sleep $((attempt * 15))
          done
          echo "Chromium installation failed after 3 attempts." >&2
          exit 1
      - name: Run isolated synthetic browser validation
        run: npm --prefix Apps/system/hermes-hub/frontend run test:e2e
      - name: Upload browser failure screenshots only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-hub-browser-failure-pngs
          path: Apps/system/hermes-hub/frontend/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - run: python3 scripts/scan-secrets.py
      - run: npm --prefix Apps/system/hermes-hub/frontend audit --audit-level=high
      - run: Apps/system/hermes-hub/backend/.venv/bin/python -m pip check

  # CI is validation only. It never runs Hermes, Ollama, clasp or deployment actions.
