[build-system]
requires = ["setuptools==80.10.2", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-hub-backend"
version = "0.1.0"
description = "Authenticated, persistent backend for Hermes Hub"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_hub_backend = ["migrations/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["../../../../tests/backend"]

[tool.ruff]
line-length = 100
